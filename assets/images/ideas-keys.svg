<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" width="560" height="450">
  <!-- Illumexa illustration: keycaps spelling "Turn Your Ideas into Impacts" around a glowing lime key. -->
  <defs>
    <radialGradient id="bg-glow" cx="52%" cy="46%" r="62%">
      <stop offset="0" stop-color="#b8e600" stop-opacity=".78"/>
      <stop offset=".28" stop-color="#6f8f00" stop-opacity=".5"/>
      <stop offset=".62" stop-color="#1c2600" stop-opacity=".35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaff7a" stop-opacity="0"/>
      <stop offset=".55" stop-color="#eaff7a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#eaff7a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="top-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a38"/>
      <stop offset=".55" stop-color="#1b1b1a"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
    <linearGradient id="side-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="top-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdf2"/>
      <stop offset=".6" stop-color="#e3e8d2"/>
      <stop offset="1" stop-color="#c3c9b0"/>
    </linearGradient>
    <linearGradient id="side-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9b08f"/>
      <stop offset="1" stop-color="#6d7358"/>
    </linearGradient>
    <linearGradient id="top-lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8ffb0"/>
      <stop offset=".45" stop-color="#e2ff3d"/>
      <stop offset="1" stop-color="#b9dc00"/>
    </linearGradient>
    <linearGradient id="side-lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6c800"/>
      <stop offset="1" stop-color="#5f7500"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <!-- Keycaps are drawn in a 100-unit frame (top face 0-92, a deep skirt below it);
         each placement tilts, squashes and scales one for a three-quarter perspective. -->
    <g id="cap-dark">
      <rect x="-8" y="26" width="116" height="104" rx="24" fill="url(#side-dark)"/>
      <rect x="0" y="0" width="100" height="92" rx="20" fill="url(#top-dark)"/>
      <rect x=".6" y=".6" width="98.8" height="90.8" rx="19.4" fill="none" stroke="#d9ff2e" stroke-opacity=".28" stroke-width="1.2"/>
    </g>
    <g id="cap-light">
      <rect x="-8" y="26" width="116" height="104" rx="24" fill="url(#side-light)"/>
      <rect x="0" y="0" width="100" height="92" rx="20" fill="url(#top-light)"/>
      <rect x=".6" y=".6" width="98.8" height="90.8" rx="19.4" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.2"/>
    </g>
    <g id="cap-lime">
      <rect x="-8" y="26" width="116" height="104" rx="24" fill="url(#side-lime)"/>
      <rect x="0" y="0" width="100" height="92" rx="20" fill="url(#top-lime)"/>
      <rect x=".6" y=".6" width="98.8" height="90.8" rx="19.4" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="1.2"/>
    </g>
  </defs>

  <rect width="560" height="450" fill="#000"/>
  <rect width="560" height="450" fill="url(#bg-glow)"/>

  <!-- light rays behind the centre key -->
  <g opacity=".9">
    <rect x="262" y="0" width="3" height="300" fill="url(#ray)"/>
    <rect x="282" y="0" width="2" height="280" fill="url(#ray)"/>
    <rect x="300" y="0" width="4" height="310" fill="url(#ray)"/>
    <rect x="318" y="0" width="2" height="270" fill="url(#ray)"/>
    <rect x="243" y="10" width="2" height="250" fill="url(#ray)"/>
    <rect x="336" y="20" width="3" height="250" fill="url(#ray)"/>
  </g>

  <!-- floating particles -->
  <g fill="#eaff7a">
    <circle cx="96" cy="58" r="2.2" opacity=".7"/><circle cx="172" cy="30" r="1.6" opacity=".6"/>
    <circle cx="228" cy="92" r="2.6" opacity=".8"/><circle cx="378" cy="48" r="1.8" opacity=".7"/>
    <circle cx="452" cy="104" r="2.4" opacity=".6"/><circle cx="498" cy="34" r="1.5" opacity=".5"/>
    <circle cx="410" cy="170" r="1.4" opacity=".6"/><circle cx="140" cy="140" r="1.4" opacity=".5"/>
    <circle cx="520" cy="220" r="2" opacity=".5"/><circle cx="60" cy="250" r="1.6" opacity=".4"/>
    <circle cx="350" cy="120" r="1.2" opacity=".8"/><circle cx="205" cy="60" r="1.2" opacity=".7"/>
  </g>

  <!-- glow pooled under the centre key -->
  <ellipse cx="300" cy="215" rx="150" ry="110" fill="#d9ff2e" opacity=".5" filter="url(#glow)"/>

  <!-- Keys, back to front. Each: translate(centre), scale(size), tilt, recentre. -->
  <g font-family="Poppins, Inter, Arial, sans-serif" font-weight="600" text-anchor="middle">
    <g transform="translate(430 70) scale(1.25) scale(1 .78) rotate(-14) translate(-50 -46)">
      <use href="#cap-light"/>
      <text x="50" y="54" font-size="19" fill="#23261c">Your</text>
    </g>
    <g transform="translate(150 92) scale(1.55) scale(1 .78) rotate(-14) translate(-50 -46)">
      <use href="#cap-dark"/>
      <text x="50" y="54" font-size="20" fill="#f2f2ee">Turn</text>
    </g>
    <g transform="translate(492 232) scale(1.55) scale(1 .78) rotate(-14) translate(-50 -46)">
      <use href="#cap-dark"/>
      <text x="50" y="54" font-size="19" fill="#f2f2ee">into</text>
    </g>
    <g transform="translate(300 182) scale(1.85) scale(1 .78) rotate(-14) translate(-50 -46)">
      <rect x="-8" y="-6" width="116" height="130" rx="26" fill="#e8ff4a" opacity=".55" filter="url(#soft)"/>
      <use href="#cap-lime"/>
    </g>
    <g transform="translate(118 300) scale(1.95) scale(1 .78) rotate(-14) translate(-50 -46)">
      <use href="#cap-light"/>
      <text x="50" y="54" font-size="18" fill="#23261c">Ideas</text>
    </g>
    <g transform="translate(345 385) scale(2.05) scale(1 .78) rotate(-14) translate(-50 -46)">
      <use href="#cap-dark"/>
      <text x="50" y="54" font-size="16" fill="#f2f2ee">Impacts</text>
    </g>
  </g>
</svg>
